server:
  port: 8080

spring:
  application:
    name: eureka-server

eureka:
  instance:
    status-page-url-path: /internal/health
    health-check-url-path: /internal/health
    hostname: ${EUREKA_INSTANCE_HOSTNAME:eureka-server}
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
        exclude: env, heapdump,beans,loggers
      base-path: /internal
  endpoint:
    health:
      show-details: never
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
---
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: prod